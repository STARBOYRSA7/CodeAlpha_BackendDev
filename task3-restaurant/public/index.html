<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantAlpha — CodeAlpha</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a1208;
            --surface: #241a0c;
            --surface2: #2e2210;
            --border: #3d2e18;
            --text: #f5ead8;
            --muted: #8a7560;
            --accent: #c9973a;
            --accent2: #e8b86d;
            --red: #e05252;
            --green: #4caf78;
            --blue: #5b9bd5;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* NAVIGATION */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .nav-left-group { display: flex; align-items: center; gap: 20px; }
        
        /* HUB BUTTON */
        .hub-link {
            text-decoration: none;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hub-link:hover {
            background: var(--surface2);
            color: var(--accent);
            border-color: var(--accent);
        }

        .logo { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; color: var(--accent); cursor: pointer; letter-spacing: 0.02em; }
        .logo span { color: var(--text); }
        .nav-tabs { display: flex; gap: 4px; }
        .nav-tab { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .nav-tab:hover { background: var(--surface2); color: var(--text); }
        .nav-tab.active { background: var(--accent); color: var(--bg); }

        /* VIEWS */
        .view { display: none; max-width: 1200px; margin: 0 auto; padding: 32px; }
        .view.active { display: block; }

        /* HEADERS */
        .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
        .page-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 700; color: var(--accent2); }
        .page-header p { color: var(--muted); font-size: 14px; margin-top: 4px; }

        /* MENU GRID */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .menu-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; transition: all 0.2s; }
        .menu-card:hover { border-color: var(--accent); }
        .menu-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--accent2); }
        .menu-price { font-size: 18px; font-weight: 700; color: var(--accent); }

        /* ORDER FORM */
        .order-section { display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
        .order-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; position: sticky; top: 96px; }
        .order-item-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .order-item-row select, .order-item-row input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); outline: none; }
        
        .order-field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
        .order-field input, .order-field select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 11px; color: var(--text); margin-bottom: 15px; }

        /* BUTTONS */
        .action-btn, .place-order-btn { background: var(--accent); color: var(--bg); border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .add-item-btn { background: none; border: 1px dashed var(--border); color: var(--muted); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 16px; }
        .place-order-btn { width: 100%; margin-top: 10px; }
        .action-btn:hover, .place-order-btn:hover { opacity: 0.85; }

        /* STATUS BADGES */
        .status-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 5px 14px; border-radius: 100px; }
        .st-pending { background: rgba(232,184,109,0.15); color: var(--accent); }
        .st-preparing { background: rgba(91,155,213,0.15); color: var(--blue); }

        /* DASHBOARD STATS */
        .dash-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
        .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 700; color: var(--accent2); }

        /* INVENTORY */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
        .inv-card.low { border-color: var(--red); }
        .inv-qty { font-size: 28px; font-weight: 700; color: var(--accent2); font-family: 'Cormorant Garamond', serif; }

        /* TOAST */
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px 22px; border-radius: 100px; font-size: 14px; font-weight: 600; z-index: 999; transform: translateY(60px); opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateY(0); opacity: 1; }
        
        .empty-state { text-align: center; padding: 48px; color: var(--muted); }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <nav>
        <div class="logo" onclick="showView('dashboard')">Resto<span>Alpha</span></div>
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showView('dashboard')">Dashboard</button>
            <button class="nav-tab" onclick="showView('menu')">Menu</button>
            <button class="nav-tab" onclick="showView('orders')">Orders</button>
            <button class="nav-tab" onclick="showView('inventory')">Inventory</button>
        </div>
        <div style="color: var(--muted); font-size: 12px;">Local Server: 127.0.0.1:5000</div>
    </nav>

    <!-- DASHBOARD -->
    <div id="dashboardView" class="view active">
        <div class="page-header">
            <div><h2>Dashboard</h2><p>Today's Overview</p></div>
            <button class="action-btn" onclick="loadDashboard()">↻ Refresh</button>
        </div>
        <div class="dash-stats">
            <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value" id="dRevenue">R0</div></div>
            <div class="stat-card"><div class="stat-label">Orders</div><div class="stat-value" id="dOrders">0</div></div>
            <div class="stat-card"><div class="stat-label">Stock Alerts</div><div class="stat-value" id="dStock">0</div></div>
        </div>
        <div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px">
            <h3 style="margin-bottom:15px; color:var(--accent2)">Live Orders</h3>
            <div id="dashOrders"></div>
        </div>
    </div>

    <!-- MENU -->
    <div id="menuView" class="view">
        <div class="page-header"><div><h2>Menu Management</h2><p>Items currently in kitchen</p></div></div>
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- ORDERS -->
    <div id="ordersView" class="view">
        <div class="page-header"><div><h2>Orders</h2><p>New and Existing</p></div></div>
        <div class="order-section">
            <div id="ordersList"></div>
            <div>
                <div class="order-panel">
                    <h3>New Order</h3>
                    <div class="order-field"><label>Customer Name</label><input type="text" id="oCustomer" placeholder="e.g. John Doe"></div>
                    <div id="oItems"></div>
                    <button class="add-item-btn" onclick="addOrderItemRow()">+ Add Item</button>
                    <button class="place-order-btn" onclick="placeOrder()">Place Order →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- INVENTORY -->
    <div id="inventoryView" class="view">
        <div class="page-header"><div><h2>Inventory</h2><p>Stock levels</p></div></div>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000';
        let menuItems = [];

        function showView(v) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(v + 'View').classList.add('active');
            event.target.classList.add('active');
            
            if (v === 'dashboard') loadDashboard();
            if (v === 'menu') loadMenu();
            if (v === 'orders') { loadOrders(); loadMenuForOrder(); }
            if (v === 'inventory') loadInventory();
        }

        async function loadDashboard() {
            try {
                const rep = await fetch(`${API}/api/reports/daily`).then(r => r.json());
                const orders = await fetch(`${API}/api/orders`).then(r => r.json());
                
                document.getElementById('dRevenue').textContent = `R${rep.revenue}`;
                document.getElementById('dOrders').textContent = rep.ordersCount;
                document.getElementById('dStock').textContent = rep.lowStockItems.length;

                const active = orders.filter(o => o.status === 'pending');
                document.getElementById('dashOrders').innerHTML = active.length 
                    ? active.map(o => `<div style="padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between">
                        <span>${o.customerName}</span><strong>R${o.total}</strong></div>`).join('')
                    : '<p style="color:var(--muted)">No active orders</p>';
            } catch (e) { toast("Server offline"); }
        }

        async function loadMenu() {
            const items = await fetch(`${API}/api/menu`).then(r => r.json());
            document.getElementById('menuGrid').innerHTML = items.map(i => `
                <div class="menu-card">
                    <div class="menu-name">${i.name}</div>
                    <div class="menu-price">R${i.price}</div>
                    <p style="font-size:12px; color:var(--muted)">${i.description}</p>
                </div>`).join('');
        }

        async function loadOrders() {
            const orders = await fetch(`${API}/api/orders`).then(r => r.json());
            const list = document.getElementById('ordersList');
            list.innerHTML = orders.length ? orders.map(o => `
                <div style="background:var(--surface); padding:20px; border-radius:14px; margin-bottom:10px; border:1px solid var(--border)">
                    <div style="display:flex; justify-content:space-between">
                        <span style="font-weight:700">${o.customerName}</span>
                        <span class="status-badge st-${o.status}">${o.status}</span>
                    </div>
                    <div style="color:var(--accent); font-weight:700; margin-top:10px">Total: R${o.total}</div>
                </div>`).join('') : '<div class="empty-state">No orders found</div>';
        }

        async function loadMenuForOrder() {
            menuItems = await fetch(`${API}/api/menu`).then(r => r.json());
            document.getElementById('oItems').innerHTML = '';
            addOrderItemRow();
        }

        function addOrderItemRow() {
            const div = document.createElement('div');
            div.className = 'order-item-row';
            div.innerHTML = `
                <select style="flex:1">
                    ${menuItems.map(m => `<option value="${m.id}">${m.name} (R${m.price})</option>`).join('')}
                </select>
                <input type="number" value="1" min="1" style="width:60px">
            `;
            document.getElementById('oItems').appendChild(div);
        }

        async function placeOrder() {
            const customer = document.getElementById('oCustomer').value || 'Walk-in';
            const rows = document.querySelectorAll('.order-item-row');
            const items = Array.from(rows).map(row => ({
                menuItemId: row.querySelector('select').value,
                quantity: parseInt(row.querySelector('input').value)
            }));

            const res = await fetch(`${API}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ customerName: customer, items })
            });

            if (res.ok) {
                toast("Order placed successfully! 🍽");
                loadOrders();
                document.getElementById('oCustomer').value = '';
            }
        }

        async function loadInventory() {
            const items = await fetch(`${API}/api/inventory`).then(r => r.json());
            document.getElementById('inventoryGrid').innerHTML = items.map(i => `
                <div class="inv-card ${i.quantity <= i.minLevel ? 'low' : ''}">
                    <div style="font-weight:700">${i.name}</div>
                    <div class="inv-qty">${i.quantity}</div>
                    <div style="font-size:12px; color:var(--muted)">${i.unit}</div>
                </div>`).join('');
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Initial Load
        window.onload = loadDashboard;
    </script>
</body>
</html>
